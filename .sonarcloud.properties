# Configuracion de SonarCloud (modo "Automatic Analysis").
#
# Por que SonarCloud: el repositorio ya usa ESLint (estilo y errores de
# TypeScript en cada commit, via husky y CI). SonarCloud agrega lo que ESLint no
# mira: vulnerabilidades y "security hotspots", duplicacion de codigo, deuda
# tecnica estimada y una Quality Gate visible por rama y por PR. Es gratuito
# para repositorios publicos y no requiere servidor propio.
#
# En modo automatico SonarCloud clona el repo en cada push a main y en cada PR y
# lee este archivo. No hace falta workflow ni token. Contra: no importa la
# cobertura de Jest (para eso esta `npm run test:cov:total`, ver README).
#
# Las claves de proyecto y organizacion se definen al importar el repo en
# sonarcloud.io (organizacion TerraVidMza), no aca.

# Codigo de produccion: solo src/. dist/ y coverage/ son artefactos generados.
sonar.sources=src
# Los *.spec.ts viven junto al codigo; se marcan como tests para que sus
# reglas (y la duplicacion entre fixtures) no cuenten como deuda del producto.
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*
sonar.exclusions=**/*.spec.ts,src/database/migrations/**

# Las migraciones de TypeORM se generan y no se editan: duplicacion esperada.
sonar.cpd.exclusions=src/database/migrations/**,src/database/seeds/**

sonar.sourceEncoding=UTF-8
