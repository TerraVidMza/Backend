services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terravid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terravid
    ports:
      - '5432:5432'
    volumes:
      - terravid_db_data:/var/lib/postgresql/data

volumes:
  terravid_db_data:
