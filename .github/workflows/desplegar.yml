# Construye la imagen de produccion y la publica en Artifact Registry.
#
# Este workflow NO toca la VM. La VM busca la imagen por su cuenta cada dos
# minutos (`terravid-deploy.timer`), aplica las migraciones y verifica que la
# API responda antes de dar el despliegue por bueno. El motivo esta explicado
# en deploy/actualizar.sh: migrar necesita la contrasena del superusuario de
# Postgres, que no debe salir de la VM.
#
# Consecuencia practica: cuando este workflow termina en verde, la imagen esta
# publicada, no desplegada. El despliegue se mira en la VM:
#
#     journalctl -u terravid-deploy -f
name: Desplegar

on:
  push:
    branches: [main, develop]
  # El job `verificar` tiene que correr **antes** del merge, no despues. Con los
  # disparadores anteriores (solo push a main) la verificacion llegaba cuando el
  # codigo ya estaba camino a produccion, y los PRs a develop que manda
  # CONTRIBUTING.md no verificaban nada.
  pull_request:
    branches: [main, develop]
  # Para republicar sin tener que hacer un commit vacio.
  workflow_dispatch:

# Sin claves de cuenta de servicio: GitHub firma un token OIDC y Google lo
# canjea por credenciales de corta duracion (Workload Identity Federation).
# `id-token: write` es lo que habilita ese token; un archivo JSON de credencial
# guardado como secreto es el accidente clasico y aca no hace falta ninguno.
permissions:
  contents: read
  id-token: write

# Dos merges seguidos a main no deben publicar en paralelo: la etiqueta `main`
# es movil y el orden de llegada decidiria que version queda. Sin
# cancel-in-progress, porque abandonar un push a mitad de camino puede dejar
# capas a medio subir.
concurrency:
  # Por ref: dos merges seguidos a main siguen compartiendo grupo y no publican
  # en paralelo, pero un PR ya no hace cola detras de otro PR.
  group: desplegar-${{ github.ref }}
  # En main no se cancela a mitad de camino: abandonar un push puede dejar capas
  # a medio subir. En un PR si, porque ahi no se publica nada.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGEN: us-central1-docker.pkg.dev/terravid/terravid/api

# Todas las acciones estan en mayores que corren en node24. Las anteriores
# (checkout@v4, auth@v2, los docker/*@v3 y v6) declaraban node20, que GitHub
# dejo de soportar: seguian funcionando porque el runner las forzaba a node24,
# pero avisando en cada corrida. No es un cambio cosmetico: cuando el runner
# deje de forzarlas, dejan de arrancar.
#
# Al subir se verifico que sigan existiendo los parametros que se usan acá.
# `auth@v3` dice «remove old parameters» en sus notas, y de eso depende el
# `access_token` de mas abajo: sigue estando. `setup-node@v5` empezo a cachear
# solo cuando package.json tiene `packageManager`, campo que este repositorio
# no usa, y el `cache: npm` de abajo es explicito de todas formas.
jobs:
  verificar:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La misma mayor que usa el Dockerfile (node:24-slim).
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Compilacion de tipos
        run: npx tsc --noEmit

      - name: Lint
        # Sin `--fix`, a diferencia de `npm run lint`: en CI hay que fallar, no
        # arreglar en un arbol de trabajo que se descarta al terminar el job.
        run: npx eslint "{src,test}/**/*.ts"

      - name: Tests
        run: npm test

  integracion:
    name: Smoke y e2e contra Postgres real
    runs-on: ubuntu-latest

    # Los 185 casos del smoke y los e2e son la unica verificacion que ejerce
    # constraints, triggers y aislamiento multi-empresa de verdad: los unitarios
    # no tocan SQL. Hasta ahora dependian de que alguien se acordara de correr
    # cuatro comandos a mano, y eso no escala a un equipo.
    services:
      db:
        # La misma imagen que docker-compose.yml: PostGIS no es opcional, las
        # migraciones crean la extension.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terravid
        ports:
          - 5432:5432
        # Sin esto el job arranca antes de que Postgres acepte conexiones y la
        # migracion falla con ECONNREFUSED.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3000'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: terravid
      # Valores de juguete: esta base se crea y se tira en el job. El secreto de
      # produccion vive en el .env de la VM y no pasa por aca (D-017).
      JWT_SECRET: secreto-solo-para-ci-no-usar-en-ningun-otro-lado
      IOT_API_KEY: dev-iot-api-key-solo-para-desarrollo
      BCRYPT_SALT_ROUNDS: '10'
      MAIL_TRANSPORT: log
      PUSH_TRANSPORT: log

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Esquema y datos semilla
        run: |
          npm run migration:run
          npm run seed

      - name: Tests e2e y de integracion
        # Con cobertura: los umbrales por archivo de test/jest-e2e.json son lo
        # que impide que auth, remitos o pesaje vuelvan a quedarse sin red sin
        # que nadie se entere.
        run: npm run test:cov:e2e

      - name: Cobertura combinada unit + e2e (minimo 70 % de lineas, D-028)
        run: npm run test:cov:total

      - name: Compilar y levantar la API
        # Contra `dist/`, que es lo que corre en produccion, y no contra
        # ts-node: asi el job ejerce el mismo artefacto que se despliega.
        run: |
          npm run build
          # La salida va a un archivo y no al pipe del step: sin redirigirla, el
          # runner se queda esperando a que cierre stdout y el step nunca
          # termina, aunque la API este arriba.
          npm run start:prod > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/salud || echo 000)
            # `/api/salud` consulta la base antes de contestar, asi que un 200
            # dice que la API puede servir y no solo que el proceso arranco.
            if [ "$codigo" = 200 ]; then echo "API arriba"; exit 0; fi
            sleep 2
          done
          echo "la API no respondio en 60s"; exit 1

      - name: Smoke end-to-end
        run: npm run test:smoke

      - name: Log de la API si algo fallo
        if: failure()
        run: cat /tmp/api.log || true

  publicar:
    name: Construir y publicar la imagen
    needs: [verificar, integracion]
    # Un PR verifica pero no publica: la etiqueta `main` es la que sigue la VM y
    # solo puede moverla codigo que ya esta en main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version corta del commit
        id: version
        run: echo "corta=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Autenticar contra Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: terravid
          workload_identity_provider: projects/286067019564/locations/global/workloadIdentityPools/github/providers/terravidmza
          service_account: despliegue-github@terravid.iam.gserviceaccount.com
          # El token sirve para entrar al registro con docker login. La cuenta
          # solo tiene permiso de escritura sobre este repositorio de imagenes:
          # no puede tocar la VM, la base, ni ningun otro recurso del proyecto.
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # `main` es movil y es la que sigue la VM. La del commit es inmutable
          # y sirve para saber que hay corriendo y para volver a una version
          # concreta.
          tags: |
            ${{ env.IMAGEN }}:main
            ${{ env.IMAGEN }}:${{ steps.version.outputs.corta }}
          # El cache de capas es lo que hace que un cambio de codigo no vuelva a
          # bajar todo el arbol de dependencias: `npm ci` se reusa mientras
          # package-lock.json no cambie.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Buildx agrega por defecto un manifiesto de procedencia, que en
          # Artifact Registry aparece como una version extra sin etiqueta y
          # ocupa lugar. El nivel gratuito son 0,5 GB en total.
          provenance: false

      - name: Que se publico
        run: |
          echo "Imagen publicada:"
          echo "  ${IMAGEN}:main"
          echo "  ${IMAGEN}:${{ steps.version.outputs.corta }}"
          echo
          echo "La VM la va a tomar en los proximos 2 minutos."
          echo "Para verlo:  journalctl -u terravid-deploy -f"
