# Broker MQTT de producción (D-026).
#
# Sin acceso anónimo: cada sensor tiene su usuario y solo puede publicar en
# terravid/sensores/{codigo}/lecturas. Usuarios, roles y ACL los administra la
# API con el plugin dynamic security.

per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Interno: solo la API, por la red de Compose. No se publica al host.
listener 1883

# Sensores, desde internet, con TLS. El certificado es el que Caddy obtiene y
# renueva para el dominio de la API; entrypoint.sh lo copia al arrancar.
listener 8883
certfile /mosquitto/certs/servidor.crt
keyfile /mosquitto/certs/servidor.key
